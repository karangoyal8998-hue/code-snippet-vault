<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Snippet Vault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>&lt;/&gt; Code Snippet Vault</h1>
    <div id="user-info" class="hidden">
      <span id="welcome-text"></span>
      <button id="logout-btn" class="btn-danger">Logout</button>
    </div>
  </header>

  <main class="container">
    <!-- SECTION 1: LOGIN & REGISTER -->
    <section id="auth-section" class="card">
      <h2 id="auth-title">Login to Your Vault</h2>
      <p id="auth-message" class="message"></p>

      <form id="auth-form">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" required />

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required />

        <button type="submit" id="auth-submit-btn" class="btn-primary">Login</button>
      </form>

      <p class="switch-text">
        <span id="switch-prompt">Don't have an account?</span>
        <a href="#" id="toggle-auth">Register here</a>
      </p>
    </section>

    <!-- SECTION 2: MAIN APP DASHBOARD (Shown after login) -->
    <section id="app-section" class="hidden">
      <!-- Form to Create or Update a Snippet -->
      <div class="card">
        <h2 id="form-heading">Add New Code Snippet</h2>
        <form id="snippet-form">
          <input type="hidden" id="edit-id" />

          <div class="row">
            <input type="text" id="snippet-title" placeholder="Snippet Title (e.g., Binary Search in C++)" required />
            <select id="snippet-language">
              <option value="HTML">HTML</option>
              <option value="CSS">CSS</option>
              <option value="JavaScript">JavaScript</option>
              <option value="C++">C++</option>
              <option value="Python">Python</option>
              <option value="SQL">SQL</option>
            </select>
          </div>

          <textarea id="snippet-code" rows="6" placeholder="Paste your code here..." required></textarea>

          <div class="row">
            <button type="submit" id="save-btn" class="btn-primary">Save Snippet</button>
            <button type="button" id="cancel-edit-btn" class="btn-secondary hidden">Cancel Edit</button>
          </div>
        </form>
      </div>

      <!-- Filter & List of Saved Snippets -->
      <div class="filter-bar">
        <h3>My Saved Snippets</h3>
        <select id="filter-language">
          <option value="ALL">All Languages</option>
          <option value="HTML">HTML</option>
          <option value="CSS">CSS</option>
          <option value="JavaScript">JavaScript</option>
          <option value="C++">C++</option>
          <option value="Python">Python</option>
          <option value="SQL">SQL</option>
        </select>
      </div>

      <div id="snippets-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
